<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ReservaGol — Reservar Cancha</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <script src="../js/config.js"></script>
  <style>
    .reservar-wrap { max-width:900px; margin:32px auto; padding:0 24px; }
    .paso { background:var(--gris-card); border:1px solid #2a2a2a; border-radius:14px; padding:28px; margin-bottom:20px; }
    .paso-header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
    .paso-num { width:32px; height:32px; border-radius:50%; background:var(--verde-oscuro); border:2px solid var(--verde); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.9rem; color:#fff; flex-shrink:0; }
    .paso-header h2 { font-size:1.05rem; color:#ddd; }
    .canchas-select-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
    .cancha-opcion { border:2px solid #2a2a2a; border-radius:10px; padding:16px; cursor:pointer; transition:all 0.2s; text-align:center; }
    .cancha-opcion:hover { border-color:var(--verde-oscuro); }
    .cancha-opcion.seleccionada { border-color:var(--verde); background:rgba(0,200,83,0.08); }
    .cancha-opcion h4 { color:#ddd; font-size:0.9rem; margin-bottom:4px; }
    .cancha-opcion p { color:#888; font-size:0.78rem; }
    .cancha-opcion .precio { color:var(--verde); font-weight:700; margin-top:6px; font-size:0.9rem; }
    /* Calendario */
    .cal-wrap { user-select:none; }
    .cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .cal-header h3 { color:#ddd; font-size:1rem; }
    .cal-nav { background:none; border:1px solid #333; color:#aaa; padding:5px 14px; border-radius:6px; cursor:pointer; font-size:1rem; transition:all 0.2s; }
    .cal-nav:hover { border-color:var(--verde); color:var(--verde); }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
    .cal-day-name { text-align:center; font-size:0.75rem; color:#555; padding:6px 0; text-transform:uppercase; }
    .cal-day { text-align:center; padding:10px 4px; border-radius:8px; font-size:0.88rem; cursor:pointer; transition:all 0.2s; border:1px solid transparent; color:#aaa; }
    .cal-day:hover:not(.vacio):not(.pasado) { border-color:var(--verde); color:var(--verde); }
    .cal-day.hoy { background:rgba(0,200,83,0.1); border-color:var(--verde-oscuro); color:#fff; }
    .cal-day.seleccionado { background:var(--verde); color:#000; font-weight:700; border-color:var(--verde); }
    .cal-day.pasado { color:#333; cursor:not-allowed; }
    .cal-day.vacio { cursor:default; }
    /* Horarios */
    .horarios-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:8px; margin-top:16px; }
    .hora-btn { padding:10px; text-align:center; border-radius:8px; font-size:0.85rem; border:1px solid #333; cursor:pointer; transition:all 0.2s; color:#aaa; }
    .hora-btn:hover:not(.ocupado) { border-color:var(--verde); color:var(--verde); }
    .hora-btn.ocupado { background:rgba(255,82,82,0.08); color:#ff5252; border-color:#ff525233; cursor:not-allowed; font-size:0.78rem; }
    .hora-btn.seleccionado { background:var(--verde); color:#000; font-weight:700; border-color:var(--verde); }
    /* Resumen */
    .resumen-box { background:rgba(0,200,83,0.06); border:1px solid var(--verde-oscuro); border-radius:10px; padding:20px; margin-bottom:20px; }
    .resumen-box .fila { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #1e1e1e; font-size:0.9rem; }
    .resumen-box .fila:last-child { border-bottom:none; font-weight:700; color:var(--verde); }
    .resumen-box .fila span:first-child { color:#888; }
    .resumen-box .fila span:last-child { color:#ddd; }
    .btn-confirmar { width:100%; padding:14px; background:var(--verde); color:#000; font-weight:700; font-size:1rem; border:none; border-radius:10px; cursor:pointer; transition:all 0.2s; }
    .btn-confirmar:hover { background:#00e676; }
    .btn-confirmar:disabled { background:#333; color:#555; cursor:not-allowed; }
    .paso.inactivo { opacity:0.4; pointer-events:none; }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="logo">
    <svg width="34" height="34" viewBox="0 0 52 52" fill="none">
      <circle cx="26" cy="26" r="24" fill="#0a0a0a" stroke="#00c853" stroke-width="2"/>
      <circle cx="26" cy="26" r="18" fill="#007a33"/>
      <polygon points="26,10 31,18 21,18" fill="#0a0a0a"/>
      <polygon points="26,42 31,34 21,34" fill="#0a0a0a"/>
      <line x1="26" y1="10" x2="26" y2="18" stroke="#00c853" stroke-width="1.5"/>
      <line x1="26" y1="34" x2="26" y2="42" stroke="#00c853" stroke-width="1.5"/>
    </svg>
    <div class="logo-text">Reserva<span>Gol</span></div>
  </a>
  <div class="nav-links">
    <a href="index.html">Inicio</a>
    <a href="reservar.html" class="active">Reservar</a>
    <a href="admin.html">Admin</a>
  </div>
  <div class="nav-user">
    <span id="navUser">Invitado</span>
    <button id="navBtn" class="btn-login-nav" onclick="window.location.href='login.html'">Iniciar sesión</button>
  </div>
</nav>

<div class="reservar-wrap">
  <h1 style="color:#fff;margin-bottom:8px">📅 Reservar Cancha</h1>
  <p style="color:#888;margin-bottom:28px">Selecciona la cancha, el día y la hora que prefieras.</p>

  <!-- PASO 1: Cancha -->
  <div class="paso" id="paso1">
    <div class="paso-header">
      <div class="paso-num">1</div>
      <h2>Elige la cancha</h2>
    </div>
    <div class="canchas-select-grid" id="canchasGrid">
      <div class="loading"><div class="spinner"></div><p>Cargando canchas...</p></div>
    </div>
  </div>

  <!-- PASO 2: Fecha -->
  <div class="paso inactivo" id="paso2">
    <div class="paso-header">
      <div class="paso-num">2</div>
      <h2>Elige el día</h2>
    </div>
    <div class="cal-wrap">
      <div class="cal-header">
        <button class="cal-nav" onclick="cambiarMes(-1)">&#8249;</button>
        <h3 id="calTitulo"></h3>
        <button class="cal-nav" onclick="cambiarMes(1)">&#8250;</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <!-- PASO 3: Hora -->
  <div class="paso inactivo" id="paso3">
    <div class="paso-header">
      <div class="paso-num">3</div>
      <h2>Elige la hora</h2>
    </div>
    <p id="fechaSelTitulo" style="color:#888;font-size:0.88rem;margin-bottom:4px"></p>
    <div class="horarios-grid" id="horariosGrid"></div>
  </div>

  <!-- PASO 4: Confirmar -->
  <div class="paso inactivo" id="paso4">
    <div class="paso-header">
      <div class="paso-num">4</div>
      <h2>Confirma tu reserva</h2>
    </div>
    <div class="resumen-box" id="resumenBox"></div>
    <button class="btn-confirmar" id="btnConfirmar" onclick="confirmarReserva()">
      ✅ Confirmar reserva
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
// CONFIG.API viene de config.js — apunta a http://localhost:5026/api
const API = CONFIG.API;
const token = localStorage.getItem('token') || '';
const authHeaders = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

// ─── NAVBAR ───────────────────────────────────────────────────────────────────
// Si hay token guardado, muestra el nombre del usuario y botón de cerrar sesión
if (token) {
  try {
    const p = JSON.parse(atob(token.split('.')[1]));
    document.getElementById('navUser').textContent =
      p['http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name'] || 'Usuario';
    document.getElementById('navBtn').textContent = 'Cerrar sesión';
    document.getElementById('navBtn').className = 'btn-logout';
    document.getElementById('navBtn').onclick = () => { localStorage.removeItem('token'); location.reload(); };
  } catch {}
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
// Muestra un mensaje flotante en la esquina inferior derecha
function toast(msg, err = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3500);
}

// ─── ESTADO GLOBAL ────────────────────────────────────────────────────────────
// Guarda qué cancha, fecha y hora eligió el usuario
let canchaSeleccionada = null;
let fechaSeleccionada = null;
let horaSeleccionada = null;
let canchasData = [];

// Variables del calendario
let calAnio = new Date().getFullYear();
let calMes = new Date().getMonth();
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

// ─── PASO 1: CARGAR CANCHAS ───────────────────────────────────────────────────
// Llama al endpoint GET /api/CanchaControlador/ObtenerCancha
// Renderiza una tarjeta por cada cancha recibida
async function cargarCanchas() {
  try {
    const res = await fetch(`${API}/Cancha/ObtenerCancha`, { headers: authHeaders });
    canchasData = await res.json();
    const grid = document.getElementById('canchasGrid');

    if (!canchasData.length) {
      grid.innerHTML = '<p style="color:#555">No hay canchas disponibles.</p>';
      return;
    }

    grid.innerHTML = canchasData.map((c, i) => `
      <div class="cancha-opcion" id="cop-${i}" onclick="seleccionarCancha(${i})">
        <div style="font-size:1.8rem;margin-bottom:8px">⚽</div>
        <h4>${c.nombre || 'Cancha ' + (i + 1)}</h4>
        <p>📍 ${c.ubicacion || 'Sin ubicación'}</p>
        <p>📐 ${c.dimenciones || 'N/A'}</p>
        <div class="precio">$${Number(c.precio_Hora || 0).toLocaleString('es-CO')}/hora</div>
      </div>`).join('');
  } catch {
    document.getElementById('canchasGrid').innerHTML =
      '<p style="color:#ff5252">Error al cargar canchas. Verifica que la API esté corriendo.</p>';
  }
}

// ─── SELECCIONAR CANCHA ───────────────────────────────────────────────────────
// Cuando el usuario hace click en una cancha:
// 1. Marca visualmente la cancha seleccionada
// 2. Guarda la cancha en la variable global
// 3. Activa el paso 2 (calendario)
function seleccionarCancha(i) {
  document.querySelectorAll('.cancha-opcion').forEach(el => el.classList.remove('seleccionada'));
  document.getElementById('cop-' + i).classList.add('seleccionada');
  canchaSeleccionada = canchasData[i];
  fechaSeleccionada = null;
  horaSeleccionada = null;
  document.getElementById('paso2').classList.remove('inactivo');
  document.getElementById('paso3').classList.add('inactivo');
  document.getElementById('paso4').classList.add('inactivo');
  renderCalendario();
  document.getElementById('paso2').scrollIntoView({ behavior: 'smooth' });
}

// ─── CALENDARIO ───────────────────────────────────────────────────────────────
// Dibuja el calendario del mes actual
// Los días pasados se marcan como no seleccionables
// El día de hoy se resalta en verde oscuro
function renderCalendario() {
  document.getElementById('calTitulo').textContent = MESES[calMes] + ' ' + calAnio;
  const grid = document.getElementById('calGrid');

  // Encabezados de días de la semana
  grid.innerHTML = DIAS.map(d => `<div class="cal-day-name">${d}</div>`).join('');

  const primerDia = new Date(calAnio, calMes, 1).getDay(); // qué día de la semana empieza el mes
  const totalDias = new Date(calAnio, calMes + 1, 0).getDate(); // cuántos días tiene el mes
  const hoy = new Date();
  const hoyStr = hoy.toDateString();

  // Celdas vacías antes del primer día
  for (let i = 0; i < primerDia; i++) {
    grid.innerHTML += `<div class="cal-day vacio"></div>`;
  }

  // Días del mes
  for (let d = 1; d <= totalDias; d++) {
    const fecha = new Date(calAnio, calMes, d);
    const esPasado = fecha < new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
    const esHoy = fecha.toDateString() === hoyStr;
    const esSel = fechaSeleccionada === fecha.toISOString().split('T')[0];

    let cls = 'cal-day';
    if (esPasado) cls += ' pasado';
    else if (esSel) cls += ' seleccionado';
    else if (esHoy) cls += ' hoy';

    const fechaISO = fecha.toISOString().split('T')[0]; // formato YYYY-MM-DD
    grid.innerHTML += `<div class="${cls}" onclick="${esPasado ? '' : `seleccionarFecha('${fechaISO}')`}">${d}</div>`;
  }
}

function cambiarMes(dir) {
  calMes += dir;
  if (calMes > 11) { calMes = 0; calAnio++; }
  if (calMes < 0)  { calMes = 11; calAnio--; }
  renderCalendario();
}

// ─── SELECCIONAR FECHA ────────────────────────────────────────────────────────
// Cuando el usuario hace click en un día:
// 1. Guarda la fecha seleccionada
// 2. Redibuja el calendario para marcar el día
// 3. Activa el paso 3 (horarios)
function seleccionarFecha(fecha) {
  fechaSeleccionada = fecha;
  horaSeleccionada = null;
  renderCalendario();
  document.getElementById('paso3').classList.remove('inactivo');
  document.getElementById('paso4').classList.add('inactivo');

  // Muestra la fecha en formato legible
  const fechaLegible = new Date(fecha + 'T12:00:00').toLocaleDateString('es-CO', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });
  document.getElementById('fechaSelTitulo').textContent = '📅 ' + fechaLegible;
  renderHorarios();
  document.getElementById('paso3').scrollIntoView({ behavior: 'smooth' });
}

// ─── HORARIOS ─────────────────────────────────────────────────────────────────
// Muestra los slots de hora disponibles (7am a 10pm)
// En producción, los ocupados vendrían de la API filtrando reservas por cancha+fecha
// Por ahora se simulan 3 horas ocupadas
function renderHorarios() {
  const horas = ['07:00','08:00','09:00','10:00','11:00','12:00',
                 '13:00','14:00','15:00','16:00','17:00','18:00',
                 '19:00','20:00','21:00','22:00'];
  const ocupadas = ['09:00', '14:00', '18:00']; // simulado

  document.getElementById('horariosGrid').innerHTML = horas.map(h => {
    const ocupado = ocupadas.includes(h);
    const sel = h === horaSeleccionada;
    return `
      <div class="hora-btn ${ocupado ? 'ocupado' : sel ? 'seleccionado' : ''}"
           onclick="${ocupado ? '' : `seleccionarHora('${h}')`}">
        ${h}${ocupado ? '<br><small>Ocupado</small>' : ''}
      </div>`;
  }).join('');
}

// ─── SELECCIONAR HORA ─────────────────────────────────────────────────────────
// Guarda la hora, redibuja los slots y activa el paso 4 (resumen)
function seleccionarHora(hora) {
  horaSeleccionada = hora;
  renderHorarios();
  document.getElementById('paso4').classList.remove('inactivo');
  renderResumen();
  document.getElementById('paso4').scrollIntoView({ behavior: 'smooth' });
}

// ─── RESUMEN ──────────────────────────────────────────────────────────────────
// Muestra un cuadro con el resumen de la reserva antes de confirmar
function renderResumen() {
  const fechaLegible = new Date(fechaSeleccionada + 'T12:00:00')
    .toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
  const horaFin = (parseInt(horaSeleccionada) + 1).toString().padStart(2, '0') + ':00';
  const precio = Number(canchaSeleccionada.precio_Hora || 0).toLocaleString('es-CO');

  document.getElementById('resumenBox').innerHTML = `
    <div class="fila"><span>Cancha</span><span>${canchaSeleccionada.nombre}</span></div>
    <div class="fila"><span>Ubicación</span><span>${canchaSeleccionada.ubicacion || 'N/A'}</span></div>
    <div class="fila"><span>Fecha</span><span>${fechaLegible}</span></div>
    <div class="fila"><span>Horario</span><span>${horaSeleccionada} – ${horaFin}</span></div>
    <div class="fila"><span>Total</span><span>$${precio}</span></div>`;
}

// ─── CONFIRMAR RESERVA ────────────────────────────────────────────────────────
// Llama al endpoint POST /api/ReservaControladores/CrearReserva
// Si no hay token, redirige al login
// Si la API responde OK, muestra mensaje de éxito
async function confirmarReserva() {
  if (!token) {
    toast('Debes iniciar sesión para reservar', true);
    setTimeout(() => window.location.href = 'login.html', 1500);
    return;
  }

  const btn = document.getElementById('btnConfirmar');
  btn.disabled = true;
  btn.textContent = 'Procesando...';

  const horaFin = (parseInt(horaSeleccionada) + 1).toString().padStart(2, '0') + ':00:00';

  // Objeto que se envía al backend
  const body = {
    id_Cancha: canchaSeleccionada.id_Canchas,   // GUID de la cancha
    fecha_reserva: fechaSeleccionada + 'T00:00:00', // fecha en formato ISO
    hora_inicio: horaSeleccionada + ':00',          // "07:00:00"
    hora_fin: horaFin,                              // "08:00:00"
    estado: 'Confirmada'
  };

  try {
    const res = await fetch(`${API}/ReservaControladores/CrearReserva`, {
      method: 'POST',
      headers: authHeaders,
      body: JSON.stringify(body)
    });

    if (!res.ok) throw new Error();

    // Éxito: muestra mensaje y reinicia el formulario
    toast('✅ Reserva confirmada. ¡Nos vemos en la cancha!');
    btn.textContent = '✅ Reserva confirmada';
    btn.style.background = '#007a33';
    setTimeout(() => window.location.href = 'index.html', 2000);
  } catch {
    toast('Error al confirmar la reserva. Intenta de nuevo.', true);
    btn.disabled = false;
    btn.textContent = '✅ Confirmar reserva';
  }
}

// Inicia cargando las canchas al abrir la página
cargarCanchas();
</script>
</body>
</html>
